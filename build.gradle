plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.wonik'
version = '0.0.1-SNAPSHOT'
description = 'CoreviaAI_BE'


java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// 테스트 폴더 구분 (src/test 아래에 단위·통합을 나눠 둔다)
//   src/test/unit/java               : 단위 테스트. Spring 컨텍스트·DB 없이 빠르고 결정적으로 도는 테스트(domain 규칙, policy, util)
//   src/test/integration/java        : 통합 테스트. Spring 컨텍스트·H2(PostgreSQL 모드)·MockMvc로 API·DB·보안 경계를 함께 검증
//   src/test/integration/resources   : 통합 테스트 설정(application-test.properties)
// 두 폴더는 별도 source set이라 `test`(단위)와 `integrationTest`(통합)를 따로 실행할 수 있다.
// 통합 테스트는 단위 테스트의 보조 클래스(MutableClock 등)를 그대로 쓸 수 있도록 test 출력을 classpath에 둔다.
sourceSets {
    test {
        java.srcDirs = ['src/test/unit/java']
        resources.srcDirs = ['src/test/unit/resources']
    }
    integrationTest {
        java.srcDirs = ['src/test/integration/java']
        resources.srcDirs = ['src/test/integration/resources']
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
    integrationTestCompileOnly.extendsFrom testCompileOnly
    integrationTestAnnotationProcessor.extendsFrom testAnnotationProcessor
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    description = 'Runs unit tests (src/test/unit).'
    useJUnitPlatform()
}

def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (src/test/integration).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn integrationTest
    finalizedBy tasks.named('jacocoTestReport')
}

// 커버리지는 단위·통합 테스트 결과를 합쳐 한 리포트로 만든다(CI의 PR 커버리지 코멘트가 이 XML을 읽는다).
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test'), integrationTest
    executionData.from(fileTree(layout.buildDirectory.dir('jacoco')).include('*.exec'))
    reports {
        xml.required = true
        html.required = true
    }
}
