# CoreviaAI_BE와 세션 저장용 Redis를 함께 띄운다.
# PostgreSQL은 회사 제공 DB(NFR-16)를 쓰므로 여기서 띄우지 않고 DB_URL로 연결한다.
# 값은 같은 폴더의 .env(커밋 금지)로 주입한다. 변수 목록은 .env.example 참고.
name: corevia-be

services:
  redis:
    image: redis:7.4.2-alpine
    container_name: corevia-redis
    restart: unless-stopped
    # 로컬에서 bootRun으로 붙을 수 있게 호스트 루프백에만 연다. 외부에는 노출하지 않는다.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  corevia-be:
    build:
      context: ./
    container_name: corevia-be
    restart: unless-stopped
    ports:
      - "${BE_PORT:-8080}:8080"
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INITIAL_ADMIN_LOGIN_ID: ${INITIAL_ADMIN_LOGIN_ID:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 40s

volumes:
  redis_data:
