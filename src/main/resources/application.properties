spring.application.name=CoreviaAI_BE

server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# nginx 뒤에서 실제 접속 IP(X-Forwarded-For)를 접속 로그에 남긴다. BE 포트를 외부에 직접 열지 않는 배포를 전제로 한다.
server.forward-headers-strategy=framework

# PostgreSQL (회사 제공 DB). 값은 환경변수로 주입한다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 세션 저장소 (Redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# JWT·토큰 쿠키 (global.jwt)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=10m
app.jwt.refresh-token-ttl=12h
app.jwt.cookie-secure=${AUTH_COOKIE_SECURE:true}

# 로그인 세션 (authserver, FR-ADM-01·NFR-04)
app.auth.idle-timeout=30m
app.auth.session-store=redis

# AI WBS 초안 반영 토큰 (FR-PRJ-07). 초안 내용은 저장하지 않고 한 번만 반영할 수 있게 토큰만 Redis에 둔다
app.wbs.ai-draft.token-ttl=1h
app.wbs.ai-draft.token-store=redis

# 일정 지연 감지 일일 계산 (FR-AIR-01). cron은 UTC. 임계값 UI(FR-ADM-03) 전까지 여기·환경변수로 둔다
app.risk-analysis.enabled=true
app.risk-analysis.cron=0 30 0 * * *
app.risk-analysis.progress-behind-margin-percent=0
app.risk-analysis.overload-threshold-percent=120

# 최초 시스템 관리자 (관리자가 한 명도 없을 때만 사용)
app.bootstrap.admin.login-id=${INITIAL_ADMIN_LOGIN_ID:}
app.bootstrap.admin.password=${INITIAL_ADMIN_PASSWORD:}
app.bootstrap.admin.name=${INITIAL_ADMIN_NAME:}
