# 테스트는 PostgreSQL 호환 모드 H2와 메모리 세션 저장소를 쓴다. Redis·외부 DB에 연결하지 않는다.
spring.datasource.url=jdbc:h2:mem:corevia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.data.redis.repositories.enabled=false

# 테스트 전용 서명 키(운영 비밀값 아님): Base64("corevia-test-only-jwt-signing-key-0123456789")
app.jwt.secret=Y29yZXZpYS10ZXN0LW9ubHktand0LXNpZ25pbmcta2V5LTAxMjM0NTY3ODk=
app.jwt.cookie-secure=false
app.auth.session-store=memory

app.bootstrap.admin.login-id=
app.bootstrap.admin.password=
app.bootstrap.admin.name=
